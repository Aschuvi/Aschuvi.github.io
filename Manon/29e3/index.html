<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1d23">
<title>29e3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen" class="screen">
    <div class="loading-content">
      <div class="loading-title">29e3</div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div id="loading-text" class="loading-text">Chargement...</div>
    </div>
  </div>

  <!-- Home screen: title + level selection -->
  <div id="home-screen" class="screen hidden">
    <header class="home-header">
      <h1 class="home-title">29e3</h1>
      <p class="home-subtitle">Une année, vingt souvenirs.</p>
    </header>
    <div id="level-grid" class="level-grid" role="list"></div>
    <footer class="home-footer">
      <span id="progress-count">0 / 0</span>
    </footer>
  </div>

  <!-- Level screen: one level mounts here -->
  <div id="level-screen" class="screen hidden">
    <header class="level-header">
      <button id="level-back-btn" class="level-back-btn" type="button" aria-label="Retour">←</button>
      <h2 id="level-title" class="level-title"></h2>
    </header>
    <div id="level-root" class="level-root"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
